name: Deploy Front
on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check SSH port reachable
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd
          nc -vz -w 5 ${{ secrets.DEPLOY_HOST_IP }} 1303

      - name: Install and Build
        run: |
          npm ci
          npm run build
          # Verifiquem que la carpeta existisca
          ls -la dist

      - name: Prepare remote folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          script: |
            # Creem la ruta base si no existeix
            sudo mkdir -p /var/www/sims-front/dist
            # Donem permisos a l'usuari de deploy sobre tota la carpeta del projecte
            sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} /var/www/sims-front
            # Netegem només el contingut de dist per a la nova pujada
            rm -rf /var/www/sims-front/dist/*

      - name: Upload Files (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          source: "dist/*"
          target: "/var/www/sims-front"
          # strip_components: 1 fa que "dist/index.html" s'entengui com a "index.html"
          # Per tant, el target ha de ser la carpeta PARE (/var/www/sims-front)
          # perquè en pujar-ho es crei/ompli la carpeta dist correctament.
          strip_components: 0 

      - name: Reload Web Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          script: |
            # Validem Apache2 i recarreguem
            if sudo systemctl is-active --quiet apache2; then
              sudo systemctl reload apache2
              echo "Apache2 reloaded"
            else
              echo "Apache2 is not active; checking if it needs to be started"
              sudo systemctl start apache2 || echo "Could not start Apache2"
            fi