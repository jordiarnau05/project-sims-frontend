name: Deploy Front
on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check SSH port reachable
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_IP }}
          DEPLOY_PORT: '1303'
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Missing DEPLOY_HOST_IP secret"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd
          nc -vz -w 5 "$DEPLOY_HOST" "$DEPLOY_PORT"

      - name: Install and Build
        run: |
          npm ci
          npm run build
          # Verifiquem que la carpeta de compilació s'ha generat
          ls -la dist

      - name: Prepare remote folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          script: |
            # Creem el directori i ens assegurem que l'usuari de deploy en sigui el propietari
            sudo mkdir -p /var/www/sims-front/dist
            sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} /var/www/sims-front
            # Netegem el contingut anterior per evitar fitxers vells
            rm -rf /var/www/sims-front/dist/*

      - name: Upload Files (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          source: "dist/*"
          target: "/var/www/sims-front/dist"
          strip_components: 1

      - name: Reload Web Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          script: |
            # Cambiem nginx per apache2 que és el servidor que tens actiu
            if sudo systemctl is-active --quiet apache2; then
              sudo systemctl reload apache2
              echo "Apache2 reloaded"
            else
              echo "Apache2 is not active; skipping reload"
            fi